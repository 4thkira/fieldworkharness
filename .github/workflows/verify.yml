name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Node 22 floor
            os: windows-latest
            node: '22'
          - name: macOS / Node 22 floor
            os: macos-latest
            node: '22'
          - name: Linux / Node 24 LTS
            os: ubuntu-latest
            node: '24'
          - name: Linux / Node 26 LTS
            os: ubuntu-latest
            node: '26'
          - name: Windows / Node 26 LTS
            os: windows-latest
            node: '26'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the pinned dependency tree
        run: npm ci --no-fund --no-audit --ignore-scripts
      - name: Run source and behavior checks
        run: npm run check
      - name: Verify the distributable archive
        run: npm run release:check
